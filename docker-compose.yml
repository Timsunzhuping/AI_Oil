version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: fluidmind-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://fluidmind:fluidmind_dev@postgres:5432/fluidmind_dev
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
      - API_PREFIX=/api
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fluidmind-network
    command: pnpm dev

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: fluidmind-web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
      - VITE_APP_NAME=FluidMind
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages:/app/packages
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fluidmind-network
    command: pnpm dev

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    container_name: fluidmind-ai-service
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=development
      - PORT=3002
      - LOG_LEVEL=debug
    volumes:
      - ./services/ai-service/src:/app/services/ai-service/src
      - ./packages:/app/packages
    depends_on:
      - backend
    networks:
      - fluidmind-network
    command: pnpm -F @fluidmind/ai-service dev

  postgres:
    image: ankane/pgvector:latest
    container_name: fluidmind-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fluidmind
      POSTGRES_PASSWORD: fluidmind_dev
      POSTGRES_DB: fluidmind_dev
      SEED_DATA: 'true'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations + seeds are run by docker-init.sh on FIRST init only.
      # Subsequent starts reuse the persisted data volume.
      - ./infra/db/scripts/docker-init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
      - ./infra/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./infra/db/seeds:/docker-entrypoint-initdb.d/seeds:ro
    networks:
      - fluidmind-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluidmind -d fluidmind_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fluidmind-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - fluidmind-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fluidmind-network:
    driver: bridge
