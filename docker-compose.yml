version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
    depends_on:
      - postgres
    networks:
      - fluidmind-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    networks:
      - fluidmind-network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fluidmind
      POSTGRES_PASSWORD: fluidmind_dev
      POSTGRES_DB: fluidmind_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fluidmind-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluidmind']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - fluidmind-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  fluidmind-network:
    driver: bridge
